<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Conway's Game of Life</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<button id="start-button" type="button">Start</button>
	<button id="stop-button" type="button">Stop</button>
	<button id="step-button" type="button">Step</button>
	<button id="reset-button" type="button">Reset</button>
	<label for="size-input">Size: <input type="number" id="size-input" name="grid-size" min="1" max="100" value="20"></input></label>
	<label for="generation-output">Generation: <output id="generation-output" aria-live="polite">0</output></label>
	<div class="board" id="board"></div>
</body>
</html>
